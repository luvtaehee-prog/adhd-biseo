<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADHD 업무 비서</title>
  <meta name="description" content="흩어진 일을 한눈에 보고, 지금 할 한 가지를 알려주는 AI 업무 비서">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233B5BDB'/><circle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/><circle cx='16' cy='16' r='1.8' fill='white'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // 저장된 테마를 먼저 적용해 깜빡임 방지
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>ADHD 업무 비서</h1>
        <p class="brand-sub">흩어진 일을 한눈에, 지금 할 한 가지만</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="serverStatus" class="status-pill" data-state="wait">서버 확인 중</span>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div id="wakeBanner" class="wake-banner" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span>무료 서버를 깨우는 중이에요. 처음 한 번은 최대 1분 걸릴 수 있어요. <b id="wakeSec">0</b>초</span>
  </div>

  <nav class="mobile-tabs" aria-label="화면 전환">
    <button type="button" data-view="chat" class="active">채팅</button>
    <button type="button" data-view="history">대화 기록</button>
    <button type="button" data-view="tasks">할 일</button>
    <button type="button" data-view="summary">요약</button>
    <button type="button" data-view="data">데이터</button>
  </nav>

  <main class="layout" data-view="chat">
    <!-- 대화 기록 -->
    <aside class="pane pane-history" data-pane="history">
      <div class="pane-head">
        <h2>대화 기록</h2>
        <button id="newChat" class="btn btn-primary btn-sm" type="button">+ 새 대화</button>
      </div>
      <ul id="convList" class="conv-list"></ul>
    </aside>

    <!-- 채팅 -->
    <section class="pane pane-chat" data-pane="chat">
      <div id="summaryStrip" class="summary-strip" aria-label="현재 데이터 요약"></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer">
        <div class="quick" id="quick">
          <button type="button">오늘 뭐부터 할까?</button>
          <button type="button">한 달 넘게 멈춰 있는 프로젝트는?</button>
          <button type="button">최근 2주 동안 어디에 시간을 제일 많이 썼어?</button>
          <button type="button">이번 주 할 일 3개만 골라줘</button>
        </div>
        <form id="chatForm" class="chat-form">
          <textarea id="chatInput" rows="1" maxlength="1000" placeholder="무엇이든 물어보세요" required></textarea>
          <button id="sendBtn" class="btn btn-primary" type="submit">보내기</button>
        </form>
      </div>
    </section>

    <!-- 오른쪽: 할 일 · 요약 · 데이터 -->
    <aside class="pane pane-side">
      <div class="side-tabs" role="tablist">
        <button type="button" role="tab" data-tab="tasks" class="active">할 일</button>
        <button type="button" role="tab" data-tab="summary">요약</button>
        <button type="button" role="tab" data-tab="data">데이터</button>
      </div>

      <div class="side-body" data-pane="tasks" data-tabpane="tasks">
        <p class="hint">끝낸 일은 체크하세요. 요약과 AI 답변에서 빠져요.</p>
        <div id="taskGroups"></div>
      </div>

      <div class="side-body" data-pane="summary" data-tabpane="summary" hidden>
        <div id="statTiles" class="stat-tiles"></div>
        <figure class="chart">
          <figcaption>월별 작업 시간</figcaption>
          <div id="monthChart" class="chart-box"></div>
        </figure>
        <figure class="chart">
          <figcaption>프로젝트별 작업 시간 <span class="muted">· 30일 넘게 기록 없으면 멈춤</span></figcaption>
          <div id="projectChart"></div>
        </figure>
      </div>

      <div class="side-body" data-pane="data" data-tabpane="data" hidden>
        <form id="dataForm" class="data-form">
          <div class="form-title"><b id="formTitle">새 기록 추가</b><button id="cancelEdit" class="link-btn" type="button" hidden>취소</button></div>
          <div class="row2">
            <label>날짜<input id="fDate" type="date" required></label>
            <label>작업 시간(분)<input id="fValue" type="number" min="1" max="1440" step="1" required placeholder="60"></label>
          </div>
          <div class="row2">
            <label>프로젝트<input id="fProject" list="projectOptions" maxlength="30" required placeholder="예: 웹사이트"></label>
            <label>분류
              <select id="fCategory">
                <option>AXOLVE</option><option>교육콘텐츠</option><option>학습</option><option>개인</option>
              </select>
            </label>
          </div>
          <label>한 일<textarea id="fMemo" rows="2" maxlength="200" required placeholder="예: 홈페이지 모바일 화면 점검"></textarea></label>
          <datalist id="projectOptions"></datalist>
          <button id="saveBtn" class="btn btn-primary" type="submit">추가</button>
        </form>

        <div class="data-tools">
          <select id="projectFilter" aria-label="프로젝트로 거르기"><option value="">전체 프로젝트</option></select>
          <span id="dataCount" class="muted"></span>
          <span class="spacer"></span>
          <button id="exportCsv" class="btn btn-sm" type="button">CSV</button>
          <button id="exportJson" class="btn btn-sm" type="button">JSON</button>
        </div>
        <ul id="dataList" class="data-list"></ul>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="app.js"></script>
</body>
</html>
